<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculo de Pagos</title>
</head>

 <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet">
<body>





    <div class="container mt-3">

        <div class="text-center mb-5">
        <h1 class="text-primary">SmartCredit UTVT</h1>
        <p class="text-muted">
            Calculo de Pagos 
        </p>
        </div>
        <div class="row">


<div class="col-mb-6">
    <div class="card shadow-sm">
        <div class="card-body">
            <h3 class="card-title mb-3 text-center">Datos del Prestamo</h3><br>
       
            <div class="mb-2 ">
            <label for="monto" class="form-label">
           <strong>Monto del Prestamo</strong> </label>
            <input type="number" class="form-control" id="monto" placeholder="Ingrese el monto">
        </div>

        <div class="mb-2">
            <label for="tasa" class="form-label">
           <strong> <br>Tasa de interes anual</strong></label><br>
            <input type="number" class="form-control" id="tasa" placeholder="Porcentaje" step="0.01">
        </div>

 <div class="mb-2">
            <label for="iva" class="form-label">
           <strong><br> Plazo para el prestamo</strong></label>
            <input type="number" class="form-control" id="plazo" placeholder="Meses">
        </div>

        <div class="mb-2">
            <label for="iva" class="form-label">
           <strong><br> Iva y sus intereses</strong></label>
            <input type="number" class="form-control" id="iva" placeholder="Ingrese iva">
        </div>
 <br>
        <button type="button" class="btn-success w-100" onclick="CalPrestamo()">
        Calcular el prestamo
    </button>
<br><br><br>
    

    
        </div>
        
    </div>
    
</div>
 

    </div>


<script src="script.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
